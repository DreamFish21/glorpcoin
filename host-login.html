<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход стримера — DROP IN</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#242037 0%,#101018 52%,#0c0b12 100%);padding:20px}.host-login{width:min(100%,440px);padding:28px;border:1px solid #453a58;border-radius:16px;background:#15131df2;box-shadow:0 18px 70px #0008}.host-login a{color:#cdb6ff;text-decoration:none;font:700 10px 'DM Mono',monospace;letter-spacing:.1em}.host-login h1{margin:24px 0 8px;font-size:28px}.host-login p{color:#a9a2b3;font-size:12px;line-height:1.6}.host-login label{display:block;margin-top:20px;color:#a9a2b3;font:9px 'DM Mono',monospace;letter-spacing:.1em}.host-login input{width:100%;height:44px;margin-top:7px;padding:0 12px;border:1px solid #40394c;border-radius:8px;background:#0f0e16;color:#f6f3fa;font:13px 'DM Mono',monospace}.host-login button{width:100%;height:44px;margin-top:12px;border:1px solid #b99aff;border-radius:8px;background:linear-gradient(110deg,#c9afff,#a787eb);color:#191321;font:800 12px Manrope,sans-serif;cursor:pointer}.host-login button:disabled{opacity:.55}.host-login output{display:block;min-height:22px;margin-top:10px;color:#ff9ca6;font:10px 'DM Mono',monospace}.host-login output.success{color:#8ee1ba}
  </style>
</head>
<body>
  <main class="host-login">
    <a href="/">DROP IN / GLORPCOIN</a>
    <h1>Вход стримера</h1>
    <p>Пароль управления находится в настройках Environment сервиса Render, в переменной <code>HOST_PASSWORD</code>. Зрителям он не нужен.</p>
    <form id="hostLoginForm"><label for="hostPassword">ПАРОЛЬ СТРИМЕРА</label><input id="hostPassword" type="password" autocomplete="current-password" required /><button id="hostLoginButton" type="submit">Войти в панель</button><output id="hostLoginMessage" aria-live="polite"></output></form>
  </main>
  <script src="host-login.js"></script>
</body>
</html>
